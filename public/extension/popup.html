<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CleanLink</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 380px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Plus Jakarta Sans", sans-serif;
      background-color: #090d16;
      color: #f1f5f9;
      font-size: 13px;
      line-height: 1.45;
      padding: 14px;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    /* Top Bar */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #1e293b;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 7px;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: -0.01em;
      color: #f8fafc;
    }

    .brand-icon {
      width: 16px;
      height: 16px;
      color: #6366f1;
    }

    .shortcut-badge {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
      font-size: 10px;
      color: #94a3b8;
      background: #1e293b;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid #334155;
    }

    /* Savings Meter */
    .savings-banner {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 9px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .savings-text {
      font-size: 12px;
      color: #94a3b8;
    }

    .savings-metric {
      font-weight: 600;
      color: #10b981;
      font-variant-numeric: tabular-nums;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
    }

    /* URL Comparison Area */
    .url-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }

    .url-block {
      background: #0d1322;
      border: 1px solid #1e293b;
      border-radius: 6px;
      padding: 8px 10px;
    }

    .url-block.clean {
      border-color: #312e81;
      background: #0f172e;
    }

    .url-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: #64748b;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-weight: 500;
    }

    .url-meta .clean-tag {
      color: #818cf8;
    }

    .url-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
      font-size: 11px;
      color: #cbd5e1;
      word-break: break-all;
      max-height: 48px;
      overflow-y: auto;
      line-height: 1.4;
      user-select: text;
    }

    .url-text.original {
      color: #64748b;
      text-decoration: line-through 1px rgba(239, 68, 68, 0.4);
    }

    .url-text::-webkit-scrollbar {
      width: 3px;
    }
    .url-text::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 2px;
    }

    /* Stripped Params List */
    .params-container {
      margin-bottom: 12px;
    }

    .params-header {
      font-size: 11px;
      color: #64748b;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .params-list {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      max-height: 52px;
      overflow-y: auto;
    }

    .param-chip {
      background: #1e1b4b;
      border: 1px solid #3730a3;
      color: #c7d2fe;
      font-size: 10.5px;
      font-family: ui-monospace, SFMono-Regular, monospace;
      padding: 2px 6px;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    .param-chip .trash-icon {
      color: #f43f5e;
      font-size: 9px;
    }

    /* Action Buttons */
    .actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .btn {
      appearance: none;
      border: 1px solid #1e293b;
      background: #0f172a;
      color: #f1f5f9;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.05s ease;
      outline: none;
      width: 100%;
    }

    .btn:hover {
      background: #1e293b;
      border-color: #334155;
    }

    .btn:active {
      transform: scale(0.99);
    }

    .btn-primary {
      background: #4f46e5;
      border-color: #6366f1;
      color: #ffffff;
      font-weight: 600;
    }

    .btn-primary:hover {
      background: #4338ca;
      border-color: #818cf8;
    }

    .btn-left {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .btn-key {
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 10px;
      opacity: 0.7;
      background: rgba(0, 0, 0, 0.25);
      padding: 1px 5px;
      border-radius: 3px;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #10b981;
      color: #ffffff;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s cubic-bezier(0.16, 1, 0.3, 1), transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 100;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Footer info */
    .footer {
      margin-top: 10px;
      text-align: center;
      font-size: 10.5px;
      color: #475569;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="brand">
      <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 7H7a4 4 0 0 0 0 8h3"/>
        <path d="M14 17h3a4 4 0 0 0 0-8h-3" stroke="#38bdf8"/>
        <line x1="8" y1="11" x2="16" y2="11"/>
        <circle cx="17" cy="7" r="1.2" fill="#38bdf8"/>
      </svg>
      <span>CleanLink</span>
    </div>
    <span class="shortcut-badge" title="Global Shortcut">Alt+Shift+C</span>
  </div>

  <!-- Savings Banner -->
  <div class="savings-banner" id="savingsBanner">
    <span class="savings-text" id="savingsText">Analyzing active page...</span>
    <span class="savings-metric" id="savingsMetric">0 chars</span>
  </div>

  <!-- URL Comparison -->
  <div class="url-section">
    <div class="url-block clean">
      <div class="url-meta">
        <span class="clean-tag">Clean URL</span>
        <span id="cleanLen" class="savings-metric">0c</span>
      </div>
      <div class="url-text" id="cleanUrlText">Loading...</div>
    </div>

    <div class="url-block" id="originalBlock">
      <div class="url-meta">
        <span>Original URL</span>
        <span id="origLen" class="savings-metric">0c</span>
      </div>
      <div class="url-text original" id="origUrlText">Loading...</div>
    </div>
  </div>

  <!-- Stripped Tracking Parameters -->
  <div class="params-container" id="paramsContainer" style="display: none;">
    <div class="params-header">
      <span>Stripped Tracking Parameters</span>
      <span id="paramCount" style="color: #cbd5e1;">(0)</span>
    </div>
    <div class="params-list" id="paramsList"></div>
  </div>

  <!-- 3 Quick Action Copy Buttons -->
  <div class="actions">
    <button class="btn btn-primary" id="btnCopyClean" title="Copy clean link">
      <div class="btn-left">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/>
          <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
        </svg>
        <span>Copy Clean URL</span>
      </div>
      <span class="btn-key">↵ Enter</span>
    </button>

    <button class="btn" id="btnCopyMarkdown" title="Copy as markdown link [Title](URL)">
      <div class="btn-left">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 7h16"/>
          <path d="M4 12h16"/>
          <path d="M4 17h10"/>
        </svg>
        <span>Copy Markdown Link</span>
      </div>
      <span class="btn-key">M</span>
    </button>

    <button class="btn" id="btnCopyShort" title="Copy compact short link">
      <div class="btn-left">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m15 15 6 6m-6-6v4.5m0-4.5h4.5"/>
          <path d="M9 9 3 3m6 6V4.5M9 9H4.5"/>
        </svg>
        <span>Copy Short Link</span>
      </div>
      <span class="btn-key">S</span>
    </button>
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toast">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 6 9 17l-5-5"/>
    </svg>
    <span id="toastText">Copied to clipboard!</span>
  </div>

  <div class="footer">Press Alt+Shift+C anytime to clean and copy without opening popup</div>

  <script src="cleaner.js"></script>
  <script src="popup.js"></script>
</body>
</html>
